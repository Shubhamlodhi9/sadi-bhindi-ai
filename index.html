<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>सड़ी भिन्डी एआई</title>

  <!-- Mobile App (PWA) Settings with New Name -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1e293b">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">
  <link rel="manifest" href='data:application/manifest+json,{"name":"सड़ी भिन्डी एआई","short_name":"सड़ी भिन्डी","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#1e293b","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/4712/4712109.png","sizes":"512x512","type":"image/png"}]}'>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
      --user-msg: #2563eb;
      --ai-msg: #334155;
      --green: #10b981;
      --purple: #8b5cf6;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    
    header { background: var(--card); padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
    .brand { font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .save-badge { font-size: 0.7rem; background: #064e3b; color: #6ee7b7; padding: 2px 7px; border-radius: 99px; font-weight: 500; }
    .controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    select, input[type="password"], button {
      background: #0f172a; color: var(--text); border: 1px solid #475569; padding: 6px 9px; border-radius: 8px; font-size: 0.8rem;
    }
    button { cursor: pointer; background: var(--accent); border: none; font-weight: 600; transition: 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-secondary { background: #475569; }
    .btn-export { background: #0f172a; border: 1px solid var(--amber); color: #fcd34d; }
    
    .search-toggle { background: #334155; border: 1px solid #64748b; }
    .search-toggle.active { background: var(--green); color: #fff; border-color: var(--green); }

    #chat-box { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 88%; padding: 11px 14px; border-radius: 14px; line-height: 1.55; font-size: 0.94rem; word-wrap: break-word; white-space: pre-wrap; position: relative; }
    .user { background: var(--user-msg); align-self: flex-end; border-bottom-right-radius: 3px; }
    .ai { background: var(--ai-msg); align-self: flex-start; border-bottom-left-radius: 3px; }
    .msg-time { display: block; font-size: 0.68rem; color: #cbd5e1; opacity: 0.75; margin-top: 6px; }
    .msg img { max-width: 100%; width: 300px; border-radius: 10px; margin-top: 10px; display: block; border: 1px solid #475569; }
    
    .sources-box { margin-top: 10px; padding-top: 8px; border-top: 1px solid #475569; font-size: 0.78rem; }
    .source-link { display: inline-block; background: #0f172a; color: #60a5fa; text-decoration: none; padding: 3px 8px; border-radius: 6px; margin: 3px 4px 0 0; border: 1px solid #334155; }
    .action-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .mini-btn { background: transparent; border: 1px solid var(--muted); color: var(--muted); padding: 3px 8px; font-size: 0.74rem; border-radius: 6px; text-decoration: none; }

    #preview-bar { display: none; background: var(--card); padding: 8px 16px; align-items: center; gap: 12px; border-top: 1px solid #334155; }
    #preview-bar img { height: 46px; border-radius: 6px; }

    footer { background: var(--card); padding: 9px 10px; display: flex; gap: 6px; align-items: center; border-top: 1px solid #334155; flex-wrap: wrap; }
    #prompt-input { flex: 1; min-width: 160px; background: #0f172a; color: var(--text); border: 1px solid #475569; padding: 10px 12px; border-radius: 10px; font-size: 0.94rem; outline: none; }
    .icon-btn { background: #334155; padding: 10px; border-radius: 10px; font-size: 0.95rem; }
    .img-gen-btn { background: var(--purple); padding: 10px 11px; border-radius: 10px; }
    .recording { background: #ef4444 !important; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.6; } }

    @media print {
      body { background: #ffffff; color: #000000; height: auto; overflow: visible; }
      header, footer, #preview-bar, .action-row { display: none !important; }
      #chat-box { overflow: visible; padding: 0; }
      .msg { max-width: 100%; border: 1px solid #cbd5e1; color: #000 !important; background: #f8fafc !important; margin-bottom: 10px; page-break-inside: avoid; }
      .user { border-left: 4px solid #2563eb; }
      .ai { border-left: 4px solid #10b981; }
      .msg-time { color: #475569; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      🥒 सड़ी भिन्डी एआई
      <span class="save-badge" id="save-status">💾 Auto-Save</span>
    </div>
    <div class="controls">
      <button id="search-btn" class="search-toggle active" onclick="toggleSearch()">🌐 लाइव सर्च: ON</button>

      <select id="mode-select">
        <option value="आप सड़ी भिन्डी एआई हैं—एक बेहद अनोखे, मजेदार लेकिन अत्यंत स्मार्ट ऑल-इन-वन असिस्टेंट। यूज़र को हर जवाब में थोड़ी मज़ेदार और अनूठी शैली के साथ सटीक समाधान दें।">🥒 सड़ी भिन्डी मोड</option>
        <option value="आप एक एक्सपर्ट फाइनेंस, स्टॉक और क्रिप्टो मार्केट एनालिस्ट हैं। ताज़ा खबरों, डेटा और रिस्क मैनेजमेंट के साथ जानकारी दें।">📈 मार्केट एक्सपर्ट</option>
        <option value="आप एक सीनियर सॉफ्टवेयर इंजीनियर हैं। साफ कोड लिखें और आसान भाषा में समझाएं।">💻 कोडिंग गुरु</option>
      </select>

      <select id="model-select">
        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
        <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
      </select>

      <input type="password" id="api-key" placeholder="Gemini API Key" style="width: 120px;" />
      <button onclick="saveKey()">Save Key</button>
      <button class="btn-export" onclick="exportTxt()">📄 TXT</button>
      <button class="btn-export" onclick="exportPdf()">📑 PDF</button>
      <button class="btn-secondary" onclick="clearChat()">🗑️</button>
    </div>
  </header>

  <div id="chat-box"></div>

  <div id="preview-bar">
    <img id="img-preview" src="" alt="Preview" />
    <span style="font-size: 0.85rem; color: var(--muted);">फोटो तैयार है</span>
    <button class="btn-secondary" onclick="clearImage()">हटाएं ✕</button>
  </div>

  <footer>
    <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="handleImage(event)" />
    <button class="icon-btn" onclick="document.getElementById('image-input').click()" title="फोटो पूछें">📷</button>
    <button class="icon-btn" id="mic-btn" onclick="toggleVoice()" title="बोलकर पूछें">🎤</button>
    <input type="text" id="prompt-input" placeholder="सड़ी भिन्डी से कुछ भी पूछें..." onkeydown="if(event.key==='Enter') sendMessage()" />
    <button class="img-gen-btn" onclick="generateImage()">🎨 इमेज</button>
    <button onclick="sendMessage()" style="padding: 10px 14px; border-radius: 10px;">भेजें ➤</button>
  </footer>

  <script>
    let chatHistory = [];
    let uiMessages = [];
    let selectedImageBase64 = null;
    let selectedImageMime = null;
    let useGoogleSearch = true;

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) document.getElementById('api-key').value = savedKey;
      loadSavedChat();
    };

    function getTimeString() {
      return new Date().toLocaleString('hi-IN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' });
    }

    function saveChatToStorage() {
      try {
        localStorage.setItem('sadi_bhindi_ui_msgs', JSON.stringify(uiMessages));
        const lightHistory = chatHistory.map(item => ({
          role: item.role,
          parts: item.parts.filter(p => p.text)
        })).filter(item => item.parts.length > 0);
        localStorage.setItem('sadi_bhindi_api_hist', JSON.stringify(lightHistory));

        const badge = document.getElementById('save-status');
        badge.textContent = '✓ सेव हो गया';
        setTimeout(() => badge.textContent = '💾 Auto-Save', 1500);
      } catch (e) { console.warn(e); }
    }

    function loadSavedChat() {
      const savedUI = localStorage.getItem('sadi_bhindi_ui_msgs');
      const savedAPI = localStorage.getItem('sadi_bhindi_api_hist');
      if (savedUI && JSON.parse(savedUI).length > 0) {
        uiMessages = JSON.parse(savedUI);
        chatHistory = savedAPI ? JSON.parse(savedAPI) : [];
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = '';
        uiMessages.forEach(msg => renderMessageOnScreen(msg));
        chatBox.scrollTop = chatBox.scrollHeight;
      } else {
        showWelcomeMessage();
      }
    }

    function showWelcomeMessage() {
      document.getElementById('chat-box').innerHTML = `<div class="msg ai">नमस्ते! मैं आपकी अपनी <b>सड़ी भिन्डी एआई</b> हूँ 🥒✨।
• नाम भले ही अजीब हो, पर दिमाग एकदम तेज़ है! 
• ऊपर अपनी <b>Gemini API Key</b> डालकर Save करें, फिर मुझसे इंटरनेट सर्च, फोटो निर्माण या कुछ भी मज़ेदार पूछें!</div>`;
    }

    function renderMessageOnScreen(msgObj) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `msg ${msgObj.role === 'user' ? 'user' : 'ai'}`;
      div.textContent = msgObj.text;

      if (msgObj.imageUrl) {
        const img = document.createElement('img');
        img.src = msgObj.imageUrl;
        div.appendChild(img);
      }

      if (msgObj.sources && msgObj.sources.length > 0) {
        const sourcesDiv = document.createElement('div');
        sourcesDiv.className = 'sources-box';
        sourcesDiv.innerHTML = '<div><b>🌐 लाइव वेब स्रोत:</b></div>';
        msgObj.sources.forEach(src => {
          const a = document.createElement('a');
          a.className = 'source-link';
          a.href = src.uri;
          a.target = '_blank';
          a.textContent = '🔗 ' + (src.title || 'वेबसाइट');
          sourcesDiv.appendChild(a);
        });
        div.appendChild(sourcesDiv);
      }

      if (msgObj.role === 'ai') {
        const actionRow = document.createElement('div');
        actionRow.className = 'action-row';
        const speakBtn = document.createElement('button');
        speakBtn.className = 'mini-btn';
        speakBtn.textContent = '🔊 सुनें';
        speakBtn.onclick = () => speakText(msgObj.text);
        actionRow.appendChild(speakBtn);

        if (msgObj.imageUrl) {
          const dl = document.createElement('a');
          dl.className = 'mini-btn';
          dl.href = msgObj.imageUrl;
          dl.target = '_blank';
          dl.textContent = '⬇️ फोटो खोलें';
          actionRow.appendChild(dl);
        }
        div.appendChild(actionRow);
      }

      if (msgObj.time) {
        const timeSpan = document.createElement('span');
        timeSpan.className = 'msg-time';
        timeSpan.textContent = msgObj.time;
        div.appendChild(timeSpan);
      }
      chatBox.appendChild(div);
    }

    function saveKey() {
      const key = document.getElementById('api-key').value.trim();
      if (!key) return alert('कृपया वैध API Key डालें!');
      localStorage.setItem('gemini_api_key', key);
      alert('API Key सुरक्षित सेव हो गई!');
    }

    function toggleSearch() {
      useGoogleSearch = !useGoogleSearch;
      const btn = document.getElementById('search-btn');
      btn.textContent = useGoogleSearch ? '🌐 लाइव सर्च: ON' : '🌐 लाइव सर्च: OFF';
      btn.classList.toggle('active', useGoogleSearch);
    }

    function handleImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      selectedImageMime = file.type;
      const reader = new FileReader();
      reader.onload = (e) => {
        const dataUrl = e.target.result;
        selectedImageBase64 = dataUrl.split(',')[1];
        document.getElementById('img-preview').src = dataUrl;
        document.getElementById('preview-bar').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearImage() {
      selectedImageBase64 = null;
      selectedImageMime = null;
      document.getElementById('image-input').value = '';
      document.getElementById('preview-bar').style.display = 'none';
    }

    function clearChat() {
      if (!confirm('क्या आप पूरी चैट हिस्ट्री मिटाना चाहते हैं?')) return;
      chatHistory = [];
      uiMessages = [];
      localStorage.removeItem('sadi_bhindi_ui_msgs');
      localStorage.removeItem('sadi_bhindi_api_hist');
      showWelcomeMessage();
    }

    async function sendMessage() {
      const apiKey = document.getElementById('api-key').value.trim() || localStorage.getItem('gemini_api_key');
      if (!apiKey) return alert('कृपया पहले ऊपर अपनी Gemini API Key डालें!');

      const inputEl = document.getElementById('prompt-input');
      const text = inputEl.value.trim();
      if (!text && !selectedImageBase64) return;

      const userMsgObj = { role: 'user', text: text || '(फोटो भेजी गई)', time: getTimeString() };
      uiMessages.push(userMsgObj);
      renderMessageOnScreen(userMsgObj);
      inputEl.value = '';

      const userParts = [];
      if (text) userParts.push({ text: text });
      if (selectedImageBase64) {
        userParts.push({ inline_data: { mime_type: selectedImageMime, data: selectedImageBase64 } });
      }
      chatHistory.push({ role: 'user', parts: userParts });
      clearImage();
      saveChatToStorage();

      const chatBox = document.getElementById('chat-box');
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'msg ai';
      loadingDiv.textContent = useGoogleSearch ? 'सड़ी भिन्डी इंटरनेट खंगाल रही है... 🌐⏳' : 'सोच रही है... ⏳';
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      const model = document.getElementById('model-select').value;
      const systemInstruction = document.getElementById('mode-select').value;
      const requestBody = {
        system_instruction: { parts: [{ text: systemInstruction }] },
        contents: chatHistory
      };
      if (useGoogleSearch) requestBody.tools = [{ google_search: {} }];

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/${model}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const candidate = data.candidates?.[0];
        const parts = candidate?.content?.parts || [];
        const replyText = parts.map(p => p.text || '').join('\n').trim() || 'कोई उत्तर नहीं मिला।';

        const chunks = candidate?.groundingMetadata?.groundingChunks || [];
        const sources = chunks.filter(c => c.web && c.web.uri).slice(0, 4).map(c => ({
          title: c.web.title,
          uri: c.web.uri
        }));

        chatHistory.push({ role: 'model', parts: [{ text: replyText }] });
        chatBox.removeChild(loadingDiv);

        const aiMsgObj = { role: 'ai', text: replyText, sources: sources, time: getTimeString() };
        uiMessages.push(aiMsgObj);
        renderMessageOnScreen(aiMsgObj);
        saveChatToStorage();
      } catch (err) {
        loadingDiv.textContent = '❌ त्रुटि: ' + err.message;
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function generateImage() {
      const apiKey = document.getElementById('api-key').value.trim() || localStorage.getItem('gemini_api_key');
      if (!apiKey) return alert('कृपया पहले ऊपर अपनी Gemini API Key डालें!');

      const inputEl = document.getElementById('prompt-input');
      const userPrompt = inputEl.value.trim();
      if (!userPrompt) return alert('कृपया नीचे बॉक्स में लिखें कि आप कैसी फोटो बनवाना चाहते हैं!');

      const userMsgObj = { role: 'user', text: '🎨 फोटो बनाएं: ' + userPrompt, time: getTimeString() };
      uiMessages.push(userMsgObj);
      renderMessageOnScreen(userMsgObj);
      inputEl.value = '';

      const chatBox = document.getElementById('chat-box');
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'msg ai';
      loadingDiv.textContent = '🎨 सड़ी भिन्डी अपनी कलाकारी दिखा रही है... ⏳';
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              role: 'user',
              parts: [{ text: `Convert this image idea into a vivid English image generation prompt (max 35 words, output ONLY the prompt): "${userPrompt}"` }]
            }]
          })
        });
        const data = await res.json();
        const enhancedPrompt = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || userPrompt;

        const seed = Math.floor(Math.random() * 999999);
        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(enhancedPrompt)}?width=1024&height=1024&seed=${seed}&nologo=true`;

        chatBox.removeChild(loadingDiv);
        const aiMsgObj = {
          role: 'ai',
          text: `✨ लीजिए आपकी फोटो तैयार है!\n(प्रॉम्प्ट: ${enhancedPrompt})`,
          imageUrl: imageUrl,
          time: getTimeString()
        };
        uiMessages.push(aiMsgObj);
        renderMessageOnScreen(aiMsgObj);
        saveChatToStorage();
      } catch (err) {
        loadingDiv.textContent = '❌ फोटो बनाने में त्रुटि: ' + err.message;
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function exportTxt() {
      if (uiMessages.length === 0) return alert('अभी कोई चैट नहीं है!');
      let content = '=== Sadi Bhindi AI - Chat History ===\n\n';
      uiMessages.forEach(m => {
        const sender = m.role === 'user' ? '👤 आप' : '🥒 सड़ी भिन्डी AI';
        content += `${sender} [${m.time || ''}]:\n${m.text}\n\n-------------------\n\n`;
      });
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Sadi-Bhindi-Chat-${new Date().toISOString().slice(0,10)}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportPdf() {
      if (uiMessages.length === 0) return alert('अभी कोई चैट नहीं है!');
      window.print();
    }

    function toggleVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert('Chrome ब्राउज़र का उपयोग करें।');
      const recognition = new SpeechRecognition();
      recognition.lang = 'hi-IN';
      const micBtn = document.getElementById('mic-btn');
      micBtn.classList.add('recording');
      recognition.onresult = (e) => document.getElementById('prompt-input').value = e.results[0][0].transcript;
      recognition.onend = () => micBtn.classList.remove('recording');
      recognition.start();
    }

    function speakText(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'hi-IN';
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
